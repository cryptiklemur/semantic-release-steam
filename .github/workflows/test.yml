name: test

on:
  pull_request:
    branches: [main, beta]
  push:
    branches:
      - '!main'
      - '!beta'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test tests/*.test.mjs
